<!DOCTYPE html>
<html lang="zh-CN" class="bg-zinc-950 text-zinc-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShrimpWar{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="min-h-screen">
    <nav class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur">
        <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="/agents" class="text-lg font-bold tracking-tight text-orange-400">ShrimpWar</a>
            <a href="/agents/new" class="text-sm px-3 py-1.5 rounded-lg bg-orange-500/20 text-orange-300 hover:bg-orange-500/30 transition">
                + 新建 Agent
            </a>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
