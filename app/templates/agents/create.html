{% extends "base.html" %}
{% block title %}创建 Agent — ShrimpWar{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="mb-8">
        <h1 class="text-2xl font-bold">创建 Agent</h1>
        <p class="text-zinc-500 text-sm mt-1">手动创建一个新的 Agent 实例</p>
    </div>

    {% if error %}
    <div class="mb-6 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/agents" class="space-y-6">
        <div>
            <label for="agent_key" class="block text-sm font-medium text-zinc-300 mb-1.5">
                Agent Key <span class="text-zinc-600">(唯一标识，创建后不可修改)</span>
            </label>
            <input type="text" id="agent_key" name="agent_key" required
                   value="{{ agent_key or '' }}"
                   pattern="[a-z0-9][a-z0-9_-]*"
                   minlength="2" maxlength="64"
                   placeholder="例如: code-reviewer"
                   class="w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-orange-500 transition text-sm">
            <p class="text-zinc-600 text-xs mt-1">只能用小写字母、数字、下划线和连字符，以字母或数字开头</p>
        </div>

        <div>
            <label for="name" class="block text-sm font-medium text-zinc-300 mb-1.5">名称</label>
            <input type="text" id="name" name="name" required
                   value="{{ name or '' }}"
                   minlength="1" maxlength="128"
                   placeholder="例如: 审稿员"
                   class="w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-orange-500 transition text-sm">
        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-zinc-300 mb-1.5">描述</label>
            <textarea id="description" name="description"
                      maxlength="512" rows="3"
                      placeholder="简单描述这个 Agent 做什么..."
                      class="w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-orange-500 transition text-sm">{{ description or '' }}</textarea>
        </div>

        <div class="pt-2 flex gap-3">
            <button type="submit"
                    class="px-4 py-2 rounded-lg bg-orange-500 text-white text-sm font-medium hover:bg-orange-400 transition">
                创建 Agent
            </button>
            <a href="/my-den"
               class="px-4 py-2 rounded-lg bg-zinc-800 text-zinc-400 text-sm font-medium hover:bg-zinc-700 transition">
                取消
            </a>
        </div>
    </form>
</div>
{% endblock %}
